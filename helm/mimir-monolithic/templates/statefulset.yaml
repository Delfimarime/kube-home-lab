{{- include "mimir-monolithic.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mimir-monolithic.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "mimir-monolithic.labels" . | nindent 4 }}
spec:
  {{/*
    One replica, and this is not a knob. Scaling this shape means running more whole copies of every
    component, each with its own ring of one, which is not a bigger deployment but several unrelated
    ones writing to the same bucket. Growing past one pod is the other topology, and a rewrite.
  */}}
  replicas: 1
  serviceName: {{ include "mimir-monolithic.fullname" . }}
  # There is no volume claim to keep, so a rolling update has nothing to preserve between pods.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "mimir-monolithic.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # A change to the process configuration rolls the pod. The per-tenant limits live in a
        # second ConfigMap and are deliberately absent from this sum: the process re-reads them
        # while it runs, so raising one tenant's ceiling should not restart the store the others
        # are writing to.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mimir-monolithic.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mimir-monolithic.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mimir
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config.file=/etc/mimir/mimir.yaml
            # Every component in one binary. This is the whole of what makes this deployment one
            # pod instead of a dozen.
            - -target=all
            # The access key reaches the process as an environment variable and is expanded into
            # the configuration here. Without this the configuration keeps the placeholder text and
            # the store authenticates with it.
            - -config.expand-env=true
          ports:
            - name: http-metrics
              containerPort: {{ .Values.server.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.server.grpcPort }}
              protocol: TCP
            - name: memberlist
              containerPort: 7946
              protocol: TCP
          env:
            {{- toYaml .Values.credentialEnv | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http-metrics
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
              readOnly: true
            - name: runtime
              mountPath: /etc/mimir/runtime
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: {{ include "mimir-monolithic.fullname" . }}
        - name: runtime
          configMap:
            name: {{ include "mimir-monolithic.fullname" . }}-runtime
        {{- /*
          Scratch, and deliberately not a claim. Everything durable is in the bucket: what lives
          here is the write-ahead log, the compaction working set and the block cache, all of which
          are rebuilt on start-up. A claim would buy nothing and would pin this pod to whichever
          node first scheduled it — which is the pin this design moved to the machine that actually
          holds the data.

          Written as two branches rather than one with an optional key: an emptyDir whose body
          renders empty is a volume with no source, which the API server rejects with an error
          naming the volume and not the missing size.
        */}}
        - name: data
          {{- if .Values.dataVolume.sizeLimit }}
          emptyDir:
            sizeLimit: {{ .Values.dataVolume.sizeLimit | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
