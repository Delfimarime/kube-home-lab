# The Secret's name. Required — there is no sensible default for a credential's name, and
# guessing one produces an object nothing reads.
name: ""

# The keys it must carry, and the whole point of this chart. They are the names the workload
# looks for: a key referenced by a `secretKeyRef` is whatever that chart calls it, and a Secret
# consumed through `envFrom` must use the environment variable names themselves. Both are the
# caller's business; this chart writes down what it is given.
#
# keys:
#   - RUSTFS_ACCESS_KEY
#   - RUSTFS_SECRET_KEY
keys: []

# Every value is the empty string, and that is not configurable. A chart that could be given a
# value would be a chart that could carry one into git.
type: Opaque

# Extra labels on the Secret, if an environment wants them for its own tooling.
labels: {}
