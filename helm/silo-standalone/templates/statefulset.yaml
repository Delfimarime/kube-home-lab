{{- include "silo-standalone.validate" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "silo-standalone.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "silo-standalone.labels" . | nindent 4 }}
spec:
  {{/*
    One replica, and this is not a knob. A single node with a single drive is a supported shape for
    this store and the whole of what this chart deploys. More replicas is not more of this — it is
    erasure coding across a set of drives, a pool that has to be declared as one at start-up, and a
    membership every server has to be started knowing. That is a different topology and a different
    chart; raising this number here would produce several unrelated stores, each convinced it is
    alone, sharing nothing but a Service.
  */}}
  replicas: 1
  serviceName: {{ include "silo-standalone.fullname" . }}
  selector:
    matchLabels:
      {{- include "silo-standalone.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "silo-standalone.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "silo-standalone.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: silo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- /*
            Arguments only, and deliberately no command: the image's entrypoint is the binary
            itself, so these are its arguments. Overriding the entrypoint as well would mean this
            chart restating a path the image already knows and getting to be wrong about it.

            Both listen addresses are stated rather than defaulted, because the ports below and the
            Service in front of them are built from the same two values and all three have to agree.
          */}}
          args:
            - server
            - /data
            - --address
            - ":{{ .Values.service.apiPort }}"
            - --console-address
            - ":{{ .Values.service.consolePort }}"
          ports:
            - name: api
              containerPort: {{ .Values.service.apiPort }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.service.consolePort }}
              protocol: TCP
          env:
            {{- include "silo-standalone.credentialEnv" . | nindent 12 }}
            - name: MINIO_SITE_REGION
              value: {{ .Values.region | quote }}
            {{- /*
              What this store answers on from outside, told to it rather than worked out from the
              request in front of it. Rendered only where a surface has an address — set to nothing,
              these would be an empty string the process reads as an address and fails to parse.
            */}}
            - name: MINIO_SERVER_URL
              value: {{ include "silo-standalone.serverUrl" . | quote }}
            {{- with .Values.browserRedirectUrl }}
            - name: MINIO_BROWSER_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- /*
              The three settings that make a memory limit mean something. Each is omitted when
              empty, because the process's own defaults are what an unlimited deployment wants and
              an empty value here is not a default but a parse error at start-up. A memory limit
              without the first of them is refused before any of this renders.
            */}}
            {{- with .Values.tuning.goMemLimit }}
            - name: GOMEMLIMIT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.tuning.goMaxProcs }}
            - name: GOMAXPROCS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.tuning.apiRequestsMax }}
            - name: MINIO_API_REQUESTS_MAX
              value: {{ . | quote }}
            {{- end }}
          {{- /*
            Both probes are on the API port and both are unauthenticated, which is what makes them
            usable as probes at all — the console port serves a browser application and has no
            equivalent. Liveness answers as soon as the process is up; readiness waits until the
            drive is initialised and the store can actually serve a request, so a pod that is
            formatting its drive is not yet in the Service.
          */}}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- /*
          The only writable path outside the drive. The root filesystem is read-only, and the
          process still needs somewhere to put the parts of a multipart upload while it assembles
          them — an emptyDir, because none of it survives a restart by design and everything that
          has to is on the claim.
        */}}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- /*
    The drive, and the reason this is a StatefulSet rather than a Deployment with a claim beside it.
    A claim rendered by the chart is an object the chart owns: whatever prunes this release prunes
    the claim, and the only copy of every object in this store goes with it. A claim from a
    volumeClaimTemplate is not garbage-collected when the StatefulSet is deleted — it outlives the
    workload and has to be removed deliberately — so a prune here costs a pod and not the data.

    Deleting the claim is then a separate act somebody performs on purpose, which is the correct
    amount of friction for the one copy.
  */}}
  volumeClaimTemplates:
    {{- /*
      **The stable label subset, and not the full one, for the same reason the selector above uses
      it.** Everything under `volumeClaimTemplates` is immutable once this object exists: the API
      server refuses an update to any field of a StatefulSet spec other than the replica count, the
      pod template, the update strategy, the revision history limit, the claim retention policy and
      minReadySeconds. The full label set carries two values that move on an ordinary upgrade — the
      chart's own version, and the running build derived from the image tag — so putting it here
      turns bumping either one into a sync that fails on every retry, with an error naming the
      whole spec and nothing about a label. What is left is what cannot change without this being a
      different deployment.
    */}}
    - metadata:
        name: data
        labels:
          {{- include "silo-standalone.selectorLabels" . | nindent 10 }}
      spec:
        # One pod writes this drive and no other reader exists, so the weakest access mode every
        # provisioner supports is also the accurate one.
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
