apiVersion: v2
name: silo-standalone
description: >-
  Silo — the maintained community fork of MinIO — as a single node with a single drive: one
  StatefulSet, one pod, one claim, an S3 API listener and a management console listener, either of
  which may be given a hostname of its own.
type: application

# The chart's own version. There is no appVersion: which build runs is decided by the image tag,
# which the caller pins and passes in, and this file is never the thing that sets it. A version
# stated here would be free to disagree with the pin, which is the one failure a second copy of a
# version can cause — so the version label is derived from the tag instead.
# Bumped for the values interface: `externalUrl.api`/`externalUrl.console` are replaced by
# `serverUrl` and `browserRedirectUrl`, which are two different questions rather than one pair —
# the first is an address this pod dials and defaults to the in-cluster Service, the second is a
# value handed to a browser. Breaking for anything rendering this chart.
version: 0.2.0

# No dependencies, and nothing wrapped. The upstream chart deploys the distributed topology —
# several servers, a pool, erasure coding across drives — and its single-node path is a corner of
# a values file built for the other shape. This deployment is one server with one drive, which is
# a supported and documented way to run it and simply the one nobody packaged on its own.
#
# What the chart adds beyond the pod spec is the pairing this store gets wrong on its own: a memory
# limit and the Go runtime settings that make the limit hold, refused together rather than
# discovered as a restart count.
