apiVersion: v2
name: k8s-monitoring-routed
description: >-
  The collector chart, plus the one route it does not render for its own OTLP receiver. Nothing
  else is re-authored and the upstream values dialect is unchanged.
type: application

# Moved for `values.schema.json`: the keys this chart owns are now stated as a schema Helm enforces,
# and the dependency's key is allowed through unconstrained. The version below did not move with it —
# nothing about the wrapped chart changed.
version: 0.2.0

# **A wrapper, not a fork.** The chart below renders no Gateway API resource for the receiver it
# creates, and one HTTPRoute is the entire difference — so it is declared as a dependency and a
# single template is added on top, rather than its values being restated or its templates copied.
#
# **Two versions are pinned here and a bump is two edits**: this chart's `version` above, and the
# dependency's below. Forgetting the second is a change that looks applied and is not.
#
# The dependency is resolved when the manifests are generated rather than vendored into this
# directory, so whatever renders this chart needs to be able to reach the repository below.
dependencies:
  - name: k8s-monitoring
    version: 4.4.0
    repository: https://grafana.github.io/helm-charts
