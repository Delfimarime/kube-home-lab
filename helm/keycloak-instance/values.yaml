# Every value here is set by the module that renders this chart. The defaults exist so the chart
# is readable on its own and so `helm template` says something useful; they are not a working
# configuration, and the two under ci/ are what CI renders.

# The name of the Keycloak resource.
name: keycloak

# Which server build runs. Empty lets the operator choose the one matching its own release, which
# is the setting that keeps the two matched without anyone maintaining it.
image: ""

# The Service the operator creates. Named here rather than left to default so the route below can
# address it without restating a convention neither of them owns.
service:
  name: keycloak-service
  port: 8080

# The server's own hostname, as a **full URL**. The bare form would leave Keycloak resolving
# scheme and port from request headers on every call.
hostname: ""

database:
  # A full JDBC URL, because sslmode has no field of its own on the resource. Setting this makes
  # the resource's host, port and database fields ignored, so they are not set at all.
  url: ""
  secretName: ""
  usernameKey: username
  passwordKey: password

bootstrapAdmin:
  # The operator reads `username` and `password` from this Secret by fixed name.
  secretName: ""

# The one path in. Null renders no HTTPRoute, which is a Keycloak reachable only by port-forward —
# a state the module above does not allow, because an issuer with no address publishes nothing.
route: null
# route:
#   hostname: id.lab.internal
#   gateway:
#     name: traefik
#     namespace: kube-system
#     sectionName: web-tls

metrics:
  # Written into spec.serviceMonitor.enabled and never omitted: that field defaults to true, so an
  # unset value on a cluster without the Prometheus operator's CRDs fails the sync.
  enabled: false
  # The tenant, written onto the Service *and* the pods — metrics are discovered through the
  # Service, logs from the pods, so labelling one routes only one. Empty leaves both unlabelled,
  # which collects as the cluster's own tenant.
  labels: {}
