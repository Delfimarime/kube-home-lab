# What a caller that has to publish these names before the cluster exists sends: every Secret name
# stated outright, and a fullnameOverride so the one derived name left — the bootstrap Issuer — does
# not depend on what the release happened to be called. This is the configuration that keeps the
# names out of a second artifact, so it is the one worth proving renders.
#
# The names here deliberately look nothing like the chart's own formula: if a template ever fell
# back to deriving one, the rendered output would say so instead of matching by accident.
fullnameOverride: pki

authorities:
  server:
    commonName: lab.internal server CA
    duration: 87600h
    secretName: lab-server-authority
  client:
    commonName: lab.internal client CA
    duration: 87600h
    secretName: lab-client-authority

certificates:
  default:
    server:
      dnsNames:
        - "*.lab.internal"
      duration: 8760h
      secretName: lab-wildcard-tls
    client:
      commonName: default.lab.internal
      duration: 8760h
      renewBefore: 720h
      secretName: lab-wildcard-client

trustBundle:
  name: cert-ca-bundle
  authorities:
    - server

gateway:
  namespace: kube-system
