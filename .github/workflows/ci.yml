# Every check here is a Makefile target, so a run reproduces locally with `make ci` and there is
# one place to change a command. What CI adds is the tooling, and the SARIF upload.
#
# There is no apply and no plan. State is local and the Argo CD this repo drives is on a home
# network no runner can reach — so what merges to main is what Argo CD reads, and a pull request
# is the only gate this repository has.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The two lint halves are independent and run side by side.
  tofu:
    name: tofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false # or `tofu` is a shell function and the Makefile's `command -v` misses it
      - uses: terraform-linters/setup-tflint@v6
      - run: make tofu-lint

  helm:
    name: helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: make helm-lint

  # A chart's README is rendered from the comments in its values.yaml, so the thing that rots is
  # the rendering: a comment edited in a pull request and the README left describing what the
  # chart used to take. Regenerating into a temporary directory and failing on any difference is
  # what keeps a generated file that lives in git worth reading. It needs no helm, only helm-docs.
  helm-docs:
    name: helm-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # There is no first-party action for helm-docs, and a pinned release tarball is more honest
      # about what it installs than an unpinned third-party one. The version is pinned because
      # helm-docs stamps it into the footer of everything it writes; the Makefile's check ignores
      # that line, so bumping this does not make every README look stale.
      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: 1.14.2
        run: |
          curl -fsSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz helm-docs
          sudo install helm-docs /usr/local/bin/helm-docs

      - run: make helm-docs-check

  # The mechanical half of a documentation review. It needs no tooling beyond the python every
  # runner already has, and it is the check most likely to catch a change that passed review —
  # a heading renamed, a table not updated, a spec still saying draft.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make docs

  # Trivy scans what Helm renders, not the chart sources: these charts take their real values from
  # Terraform, so their defaults render almost nothing and the ci/ values files are the only
  # description of what actually gets deployed.
  trivy:
    name: trivy
    needs: [helm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: aquasecurity/setup-trivy@v0.3.1

      - name: Misconfiguration scan of the rendered charts
        run: make trivy-config TRIVY_ARGS="--format sarif --output trivy-config.sarif"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Secret scan of the tree
        run: make trivy-fs TRIVY_ARGS="--format sarif --output trivy-fs.sarif"
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
