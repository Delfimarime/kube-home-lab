{{/*
Exactly one leaf per authority — that is LOCAL-002, and the range below is what enforces it:
there is nowhere to put a second. A server authority declares dnsNames; a client authority
declares a commonName, because there is no hostname to name.
*/}}
{{- range $name, $authority := .Values.authorities }}
{{- $ctx := dict "root" $ "name" $name }}
{{- $cert := required (printf "authorities.%s.certificate is required" $name) $authority.certificate }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "lab-pki.certName" $ctx }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "lab-pki.labels" $ | nindent 4 }}
spec:
  secretName: {{ include "lab-pki.certName" $ctx }}
  {{- with $cert.commonName }}
  commonName: {{ . | quote }}
  {{- end }}
  {{- with $cert.dnsNames }}
  dnsNames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # usages is what makes CERT-05 structural rather than a matter of trusting the Gateway to
  # enforce Extended Key Usage. The separation it records is really the two authorities; this
  # states the intent on the leaf as well, so a reader does not have to infer it.
  usages:
    {{- toYaml (required (printf "authorities.%s.certificate.usages is required" $name) $cert.usages) | nindent 4 }}
  duration: {{ $cert.duration | default "8760h" }}
  {{- with $cert.renewBefore }}
  # Short on a client certificate on purpose: cert-manager renews at two thirds of lifetime by
  # default, which would leave the expiry metric describing a certificate nobody has deployed.
  renewBefore: {{ . }}
  {{- end }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "lab-pki.caName" $ctx }}
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
