# Same, without a Gateway: asserts zero ReferenceGrant.
namespace: cert-manager

authorities:
  server:
    commonName: lab.internal server CA
    duration: 87600h
  client:
    commonName: lab.internal client CA
    duration: 87600h

certificates:
  default:
    server:
      dnsNames:
        - "*.lab.internal"
      duration: 8760h
    client:
      commonName: default.lab.internal
      duration: 8760h
      renewBefore: 720h

trustBundle:
  name: lab-ca-bundle
  authorities:
    - server

gateway: null
