# The shape an environment actually ships: two tenants with different ceilings, plus the reserved
# one a write carrying no tenant header lands in — which the module adds and no caller may list.
# Asserts that the two spellings of retention, this store's and the input's, meet in the overrides
# file rather than anywhere a caller can see.
storage:
  endpoint: rustfs.object-storage.svc.cluster.local:9000
  region: af-south-1
  bucket: mimir
  insecure: true

credentialEnv:
  - name: OBJECT_STORAGE_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: object-storage-credentials
        key: RUSTFS_ACCESS_KEY
  - name: OBJECT_STORAGE_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: object-storage-credentials
        key: RUSTFS_SECRET_KEY

limits:
  retention: 168h

tenants:
  lab:
    ingestion_rate: 25000
    ingestion_burst_size: 50000
    max_series: 500000
    retention: 168h
  scratch:
    ingestion_rate: 1000
    retention: 24h
  unattributed:
    retention: 24h

serviceMonitor:
  enabled: true
