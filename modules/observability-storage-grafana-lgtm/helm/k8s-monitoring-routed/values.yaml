# Everything this chart adds on its own is in this file down to `k8s-monitoring:`. Below that key
# is the dependency's own dialect, unchanged and not restated here.

# The Gateway this chart attaches its route to. null is not exposed, and null is the default: a
# receiver reachable from outside the cluster is a decision an environment makes, not one it gets
# by leaving a value alone.
#
# `sectionName` names a listener, and it is the whole of how this chart asks for a particular
# admission policy — pointed at a listener demanding a client certificate, only a caller holding
# one reaches the receiver at all; pointed at the ordinary TLS listener, anything that resolves the
# hostname can write. Both are valid and nothing here distinguishes them: a route makes a hostname
# reachable and says nothing about who may use it.
gateway: null
# gateway:
#   name: traefik
#   namespace: kube-system
#   hostname: otlp.lab.internal
#   sectionName: otlp-mtls

# What the route points at: the Service the dependency's receiver collector creates, and the port.
#
# **4318 and not 4317.** Routing the gRPC port would need an h2c backend protocol on the Service and
# a GRPCRoute rather than an HTTPRoute — two implementation-specific behaviours to depend on, for a
# transport advantage that means nothing to a laptop pushing spans over a home network. 4317 stays
# the in-cluster address, where neither problem exists.
receiver:
  service: otlp
  port: 4318

# One rule per signal this environment actually stores. The paths are the ones the protocol itself
# defines, so pushing a signal nothing here keeps gets a 404 from the Gateway rather than being
# accepted by the receiver and dropped afterwards.
#
# This is not the three hostnames that were refused elsewhere: those would have resolved to one
# socket on one pod and encoded a distinction living a layer below them. This one is where the
# protocol already put it.
routes:
  metrics: false
  logs: false
  traces: false

# Extra labels on the route, if an environment wants them for its own tooling.
labels: {}

# The dependency's values. Left empty here on purpose — every one of them is written by the module
# that renders this chart, and a default in this file would be a second place for the same decision
# to be made.
k8s-monitoring: {}
