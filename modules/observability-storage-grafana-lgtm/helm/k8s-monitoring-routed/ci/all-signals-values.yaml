# A Gateway, all three signals stored, and therefore three rules on one route. Asserts the route
# addresses the receiver and nothing else — no rule here names a store, whatever else the wrapped
# chart is running in this namespace.
gateway:
  name: traefik
  namespace: kube-system
  hostname: otlp.lab.internal
  sectionName: otlp-mtls

receiver:
  service: otlp
  port: 4318

routes:
  metrics: true
  logs: true
  traces: true

k8s-monitoring:
  cluster:
    name: lab

  destinations:
    metrics:
      type: prometheus
      url: http://mimir.observability.svc.cluster.local:8080/api/v1/push
      tenantId: lab
    logs:
      type: loki
      url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
      tenantId: lab
    traces-push:
      type: custom
      ecosystem: otlp
      traces:
        enabled: true
        target: otelcol.exporter.otlphttp.traces_store.input
      config: |
        otelcol.auth.headers "traces_store_tenant" {
          header {
            key          = "X-Scope-OrgID"
            action       = "upsert"
            from_context = "X-Scope-OrgID"
          }

          header {
            key    = "X-Scope-OrgID"
            action = "insert"
            value  = "unattributed"
          }
        }

        otelcol.exporter.otlphttp "traces_store" {
          client {
            endpoint = "http://tempo.observability.svc.cluster.local:4318"
            auth     = otelcol.auth.headers.traces_store_tenant.handler
          }
        }

  collectors:
    alloy-receiver:
      fullnameOverride: otlp
      presets:
        - deployment
        - otel-receiver
    alloy-metrics:
      presets:
        - deployment

  clusterMetrics:
    enabled: true
    collector: alloy-metrics
    destinations:
      - metrics

  # Cluster metrics are scraped from these two, so switching that feature on without them is
  # refused at render time. They follow the same flag the feature does.
  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true

  applicationObservability:
    enabled: true
    collector: alloy-receiver
    destinations:
      - traces-push
    receivers:
      otlp:
        grpc:
          enabled: true
          port: 4317
          includeMetadata: true
        http:
          enabled: true
          port: 4318
          includeMetadata: true
    metrics:
      enabled: false
    logs:
      enabled: false
    traces:
      enabled: true

  annotationAutodiscovery:
    enabled: false

  selfReporting:
    enabled: false
