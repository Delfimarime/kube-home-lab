{{- if not .Values.name -}}
{{- fail "secret-template: .Values.name is required — a Secret with no name is an object nothing can reference." -}}
{{- end -}}
{{- if not .Values.keys -}}
{{- fail "secret-template: .Values.keys must name at least one key — a Secret with the right name and no keys fails at pod start, which reads as a broken module." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name | quote }}
  # Deliberately the release namespace rather than a value: the Application's destination decides
  # where this goes, and a second place to say it is a second place for it to be wrong.
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: {{ .Values.type }}
# Empty strings, and every one of them is valid base64 for "nothing". The operator patches these;
# the Application ignoring `.data` is what stops the next sync putting them back.
data:
{{- range .Values.keys }}
  {{ . | quote }}: ""
{{- end }}
