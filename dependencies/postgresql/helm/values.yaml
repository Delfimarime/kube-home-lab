# Name of the StatefulSet, Service and PVC. Defaults to the release name.
fullnameOverride: ""

# Pinned to an exact PostgreSQL version. `latest` is never used as a tag: it floats, and an
# upgrade here has to be a deliberate edit rather than something a re-pull decides for us.
# 18.4 was the current release when this chart was written.
#
# Bumping the minor (18.4 -> 18.5) is safe. Bumping the major is not — see the note on the
# volume mount in templates/statefulset.yaml before you try it.
image:
  repository: postgres
  tag: "18.4"
  pullPolicy: IfNotPresent

# `database` and `username` are not secret and stay here, matching what the CloudNativePG
# chart took as cluster.initdb.
#
# The password is generated once, into a Secret this chart owns. Leave existingSecret empty
# for that; set it to the name of a Secret you manage yourself and nothing here is created.
#
# Keeping a generated password stable takes two mechanisms, because this chart can be applied
# two ways and neither mechanism covers both. Under plain Helm the template reads the live
# Secret and reuses what is there. Under Argo CD that read always comes back empty, so the
# Application has to be told to ignore the field instead:
#
#   ignore_difference { kind = "Secret", name = <release>, json_pointers = ["/data/password"] }
#   sync_options      = [..., "RespectIgnoreDifferences=true"]
#
# Both are required. Without the first, `helm upgrade` rotates the credential; without the
# second, every Argo CD sync does. templates/secret.yaml explains the split in full.
auth:
  database: postgres
  username: postgres
  existingSecret: ""
  secretKey: password
  passwordLength: 32

service:
  type: ClusterIP
  port: 5432
  # Only read when type is NodePort. k3s allows 30000-32767 unless the apiserver was started
  # with a wider --service-node-port-range; outside that the Service is rejected.
  nodePort: ""

persistence:
  size: 8Gi
  # Empty means the cluster default StorageClass, which on k3s is local-path.
  storageClass: ""

# Rendered as `-c <key>=<value>` server arguments. No ConfigMap and no postgresql.conf: a
# handful of settings does not need a file to live in, and this way they are visible in
# `kubectl describe pod` rather than one indirection away.
parameters:
  max_connections: "100"

resources: {}
affinity: {}
nodeSelector: {}
tolerations: []
