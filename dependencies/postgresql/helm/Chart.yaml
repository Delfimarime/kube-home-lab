apiVersion: v2
name: postgresql
description: Single-instance PostgreSQL on the official upstream image.
type: application

# The chart's own version, bumped when the templates change. Unrelated to appVersion.
version: 0.1.0

# Kept in step with image.tag. It is the reader-facing answer to "which PostgreSQL is this?",
# so a version bump is an edit in two places on purpose — appVersion here, image.tag in
# values.yaml — and neither is derived from the other.
appVersion: "18.4"
