{{- if not .Values.auth.existingSecret }}
{{- /*
  The password is held stable by two independent mechanisms, because neither one covers both
  ways this chart can be applied.

  Under plain Helm, `lookup` below reads the live Secret and reuses the password already
  there, so an upgrade or rollback leaves it alone.

  Under Argo CD, `lookup` always returns empty — manifests are rendered with `helm template`,
  which has no cluster access — so the fallback fires and every render produces a new
  password. What stops that reaching the cluster is the Application ignoring the field:

    ignore_difference { kind = "Secret", name = <release>, json_pointers = ["/data/password"] }
    sync_options      = [..., "RespectIgnoreDifferences=true"]

  Neither is redundant. Drop the lookup and `helm upgrade` silently rotates the credential;
  drop the ignore rule and every Argo CD sync does. Both are needed, and each is useless
  against the other's failure.
*/}}
{{- $current := "" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "postgresql.secretName" .) }}
{{- if and $existing $existing.data (hasKey $existing.data .Values.auth.secretKey) }}
{{-   $current = index $existing.data .Values.auth.secretKey }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.secretName" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    # Deletion, not update — this is what keeps `helm uninstall` and a failed rollback from
    # taking the credential with them. It does nothing about upgrades; that is the lookup's job.
    helm.sh/resource-policy: keep
type: Opaque
# `data` with an explicit b64enc, not `stringData`. Argo CD diffs the rendered manifest
# against the live object, and the live object only ever has `data` — rendering `stringData`
# would leave /data/password absent from the desired state and the ignore rule with nothing
# to match. It is also why $current needs no re-encoding: lookup returns it already base64.
data:
  # Stable: derived from values, so it syncs like anything else.
  username: {{ .Values.auth.username | b64enc | quote }}
  password: {{ $current | default (randAlphaNum (int .Values.auth.passwordLength) | b64enc) | quote }}
{{- end }}
