apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  # One instance. Nothing here replicates, so there is no second replica to make consistent.
  replicas: 1
  serviceName: {{ include "postgresql.fullname" . }}
  selector:
    matchLabels:
      {{- include "postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgresql.labels" . | nindent 8 }}
    spec:
      # 999 is the postgres user in the official image. Starting as it directly makes the
      # entrypoint skip its root-then-gosu path, and fsGroup is then the only thing making
      # the volume writable — without it initdb fails on an empty PVC.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # `args`, never `command`. Replacing the command would skip docker-entrypoint.sh,
          # which is what runs initdb on an empty volume, and would leave whatever replaced
          # it as PID 1 — the image sets STOPSIGNAL to SIGINT so that Postgres gets a fast
          # shutdown, and anything that does not forward that signal turns every pod delete
          # into a crash recovery on the next start.
          args:
            - postgres
            {{- range $key, $value := .Values.parameters }}
            - -c
            - {{ printf "%s=%s" $key (toString $value) | quote }}
            {{- end }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.auth.username | quote }}
            # Read from the Secret, never templated in. POSTGRES_PASSWORD is only consumed by
            # initdb on an empty volume; on every later start the password already in the
            # database wins, which is what makes the ignore rule safe rather than merely quiet.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: {{ .Values.auth.secretKey }}
          ports:
            - name: postgresql
              containerPort: 5432
          # Probed over TCP on purpose. During first start the entrypoint runs a temporary
          # server with listen_addresses empty, reachable on the unix socket only, so a
          # socket probe reports ready while initdb is still running.
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - 127.0.0.1
                - -p
                - "5432"
                - -U
                - {{ .Values.auth.username | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
          # Cheaper than pg_isready and answers the only question worth restarting over:
          # is it still accepting connections.
          livenessProbe:
            tcpSocket:
              port: postgresql
            initialDelaySeconds: 60
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Mounted at the image's declared volume, not at PGDATA. PGDATA is
            # /var/lib/postgresql/<major>/docker — the major version is part of the path, so
            # bumping image.tag from 18 to 19 points the server at an empty sibling
            # directory and it initdbs a blank database beside the real one instead of
            # failing. A major upgrade is a dump and restore, not a tag edit.
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
